version: "3.8"

services:

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network
  naynco-help:
    build: .
    container_name: nyanco
    depends_on:
      - redis
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app  # 로컬 코드 변경 자동 반영
      - ./myapi.db:/myapi.db  # SQLite 데이터 파일 유지
      - ./models:/models
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
    runtime: nvidia
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - app_network


networks:
  app_network:
    driver: bridge