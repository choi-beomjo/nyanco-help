name: Deploy to Artifact Registry

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker asia-northeast3-docker.pkg.dev

    - name: Build and Push Docker image
      run: |
        docker build -t asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.IMAGE_NAME }} .
        docker push asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.IMAGE_NAME }}
    
    - name: Print DB URL
      run: echo "DB_URL is $DB_URL"
      env:
        DB_URL: ${{ secrets.DB_URL }}

    - name: Alembic revision
      env:
        DB_URL: ${{ secrets.DB_URL }}
      run: |
        pip install -r requirements.txt
        cd app
        mkdir -p alembic/versions
        alembic revision --autogenerate -m "Auto revision"
    
    - name: Run Alembic Migration
      env:
        DB_URL: ${{ secrets.DB_URL }}
      run: 
        cd app
        alembic upgrade head
